<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Paris Taybeh · אטלייר פאריס טייבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Frank+Ruhl+Libre:wght@500;700&family=Amiri:wght@400;700&family=Assistant:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F5; --surface:#FFFFFF; --ink:#151214; --muted:#6B6166; --line:#E7E0DC;
  --accent:#A8324F; --accent-ink:#FFFFFF; --gold:#9C7F4B; --soft:#F2ECE8; --err:#B3261E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121011; --surface:#1C191A; --ink:#F3EEEB; --muted:#B3A9A4; --line:#332D2E;
    --accent:#E26A88; --accent-ink:#121011; --gold:#CDB27E; --soft:#252022; --err:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121011; --surface:#1C191A; --ink:#F3EEEB; --muted:#B3A9A4; --line:#332D2E;
  --accent:#E26A88; --accent-ink:#121011; --gold:#CDB27E; --soft:#252022; --err:#FF8A80;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:17px;line-height:1.6;
}
html[lang="ar"] body{font-family:"Noto Sans Arabic","Assistant",system-ui,Tahoma,Arial,sans-serif}
h1,h2,h3{font-family:"Frank Ruhl Libre","Times New Roman",serif;font-weight:700;line-height:1.2;margin:0}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:"Amiri","Times New Roman",serif}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{font-family:"Bodoni Moda","Times New Roman",serif;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.mark{font-family:"Bodoni Moda","Times New Roman",serif;font-size:22px;letter-spacing:.01em;text-decoration:none;color:var(--ink);direction:ltr}
.mark i{color:var(--accent)}
.langs{margin-inline-start:auto;display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:15px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cart-btn{
  position:relative;border:1px solid var(--ink);background:none;border-radius:999px;
  padding:7px 16px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center
}
.cart-btn .count{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px;padding:0 6px}
@media (max-width:480px){
  .top-in{gap:8px;padding:10px 12px}
  .mark{font-size:17px;white-space:nowrap}
  .langs button{padding:4px 8px;font-size:14px}
  .cart-btn{padding:6px 10px;gap:6px;font-size:15px}
}

/* hero */
.hero{max-width:1120px;margin:0 auto;padding:64px 20px 40px}
.wordmark{
  font-family:"Bodoni Moda","Times New Roman",serif;font-weight:400;direction:ltr;
  font-size:clamp(32px,9vw,84px);line-height:1;letter-spacing:-.01em;margin:0;white-space:nowrap;
  text-align:center;
}
.hero{text-align:center}
.hero p.tag{margin-inline:auto}
.swatches{justify-content:center}
@media (max-width:480px){.hero{padding:40px 16px 32px}.swatches{gap:7px;margin:26px 0 22px}.swatches span{width:26px;height:58px}.hero p.tag{font-size:18px}}
.wordmark em{font-style:italic;color:var(--accent)}
.local-name{font-size:clamp(22px,3.4vw,32px);margin-top:14px;color:var(--muted)}
.swatches{display:flex;gap:10px;margin:36px 0 28px;flex-wrap:wrap}
.swatches span{width:34px;height:76px;border-radius:17px 17px 6px 6px;display:block;box-shadow:inset 0 -14px 0 rgba(0,0,0,.18)}
.hero p.tag{font-size:20px;max-width:34em;margin:0 0 24px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;
  padding:13px 26px;font-weight:700;cursor:pointer;text-decoration:none;font-size:17px
}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn.wa{background:#1F8A4C;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* hero v2 */
.hero{display:grid;gap:36px;align-items:center;padding-top:48px}
@media (min-width:900px){.hero{grid-template-columns:1fr 1.15fr}}
.eyebrow{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:14px;direction:ltr}
.hero .wordmark{font-size:clamp(34px,8vw,66px)}
.hero .local-name{margin-top:8px;margin-bottom:18px}
.hero .swatches{margin:28px 0 0}
.hero .swatches span{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line)}
.hero-img{border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 30px 70px -40px rgba(0,0,0,.45)}
.hero-img img{display:block;width:100%;height:auto}
.film{background:#111;color:#F5F0EC;text-align:center;padding:26px 16px;position:relative;font-family:"Bodoni Moda","Times New Roman",serif;font-size:clamp(15px,2.4vw,19px);letter-spacing:.06em}
html[lang="ar"] .film{font-family:"Amiri",serif}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:7px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 9px,transparent 9px 22px)}
.film::before{top:6px}.film::after{bottom:6px}

.logo{margin:0 auto;max-width:520px;width:100%}
.logo img{display:block;width:100%;height:auto;border-radius:18px;background:#0E0C0D;box-shadow:0 22px 50px -30px rgba(0,0,0,.6)}

.logo-row{max-width:1120px;margin:0 auto;padding:40px 20px 4px;text-align:center}
.logo-row .logo{max-width:340px}
.logo-row + .hero{padding-top:28px}
@media (max-width:480px){.logo-row{padding:24px 16px 0}}

/* product viewer + gallery */
.prod-open{all:unset;display:block;cursor:zoom-in;position:relative}
.prod-open:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.pcount{position:absolute;bottom:10px;inset-inline-end:10px;background:rgba(17,17,17,.78);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;direction:ltr}
.prod h3 button{all:unset;cursor:pointer}
.gallery{max-width:1120px;margin:0 auto;padding:0 20px 72px;text-align:center}
.gallery h2{font-size:clamp(30px,4.5vw,44px);margin-bottom:6px}
.gallery p{color:var(--muted);margin:0 0 22px}
.gal{columns:3 260px;column-gap:14px;text-align:start}
.gal button{all:unset;display:block;width:100%;margin:0 0 14px;break-inside:avoid;border-radius:16px;overflow:hidden;cursor:zoom-in;background:#fff;box-shadow:0 14px 30px -24px rgba(0,0,0,.4)}
.gal button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gal img{display:block;width:100%;height:auto;transition:transform .4s}
.gal button:hover img{transform:scale(1.03)}
@media (max-width:560px){.gal{columns:2;column-gap:10px}.gal button{margin-bottom:10px}}
.pv{position:fixed;inset:0;z-index:40;background:rgba(10,8,9,.88);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.pv.open{display:flex}
.pv-box{background:var(--surface);border-radius:22px;overflow:hidden;width:min(980px,100%);max-height:100%;display:grid;grid-template-columns:1fr;overflow-y:auto}
@media (min-width:820px){.pv-box.has-info{grid-template-columns:1.25fr 1fr}}
.pv-stage{position:relative;background:#fff;display:flex;align-items:center;justify-content:center;min-height:300px;touch-action:pan-y}
.pv-stage img{display:block;max-width:100%;max-height:72vh;object-fit:contain;user-select:none;-webkit-user-drag:none}
.pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(17,17,17,.7);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}
.pv-prev{inset-inline-start:10px}.pv-next{inset-inline-end:10px}
.pv-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.pv-dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(17,17,17,.25);cursor:pointer}
.pv-dots button[aria-current="true"]{background:#111;width:22px;border-radius:5px}
.pv-info{padding:26px 24px;display:flex;flex-direction:column;gap:10px;text-align:start}
.pv-info h3{font-size:26px}
.pv-info .desc{color:var(--muted);margin:0}
.pv-info .price{font-size:24px}
.pv-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pv-thumbs button{all:unset;width:58px;height:58px;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:#fff}
.pv-thumbs button[aria-current="true"]{border-color:var(--ink)}
.pv-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.pv-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:14px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#111;font-size:26px;cursor:pointer;z-index:2}
.pv-info .btn{margin-top:auto}

/* shop */
.shop{max-width:1120px;margin:0 auto;padding:24px 20px 72px}
.shop-head{display:flex;flex-wrap:wrap;align-items:end;gap:16px;justify-content:space-between;margin-bottom:22px}
.shop-head h2{font-size:clamp(30px,4.5vw,44px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:12px}.prod-body{padding:12px}.prod h3{font-size:16px}.prod .desc{font-size:13px}.prod-foot{flex-direction:column;align-items:stretch;gap:8px}.add{width:100%}}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.prod-art{aspect-ratio:1/1;display:grid;place-items:center;background:var(--soft);border-bottom:1px solid var(--line)}
.prod-art svg{height:150px;width:auto}
.prod-art.photo{background:#fff}
.prod-art.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.prod:hover .prod-art.photo img{transform:scale(1.04)}
.prod{transition:box-shadow .25s}.prod:hover{box-shadow:0 18px 40px -28px rgba(0,0,0,.35)}
.prod-art{overflow:hidden}
.prod-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod h3{font-size:20px}
.brand{font-size:13px;font-weight:700;color:var(--gold);direction:ltr;unicode-bidi:isolate}
.prod .desc{color:var(--muted);font-size:15px;margin:0;flex:1}
.prod-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.price{font-weight:700;font-size:19px}
.add{border:1px solid var(--ink);background:none;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:15px}
.add.on{background:var(--ink);color:var(--bg)}

/* how it works */
.how{max-width:1120px;margin:0 auto;padding:0 20px 72px}
.how{text-align:center}
.how h2{font-size:30px;margin-bottom:18px}
.how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;counter-reset:s}
.how li{counter-increment:s;border-top:2px solid var(--ink);padding-top:12px}
.how li::before{content:counter(s);font-family:"Bodoni Moda",serif;font-size:34px;color:var(--accent);display:block;line-height:1}
.how li strong{display:block;font-size:18px;margin:6px 0 2px}
.how li span{color:var(--muted);font-size:15px}

footer{border-top:1px solid var(--line)}
.foot-in{max-width:1120px;margin:0 auto;padding:28px 20px 36px;display:flex;flex-wrap:wrap;gap:24px 48px;color:var(--muted);font-size:15px}
.foot-in strong{color:var(--ink);display:block}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(20,8,16,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);z-index:21;
  background:var(--surface);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateX(105%);transition:transform .25s ease;
}
html[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.open{transform:none!important}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:26px}
.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;padding:4px 8px;color:var(--muted)}
.d-body{flex:1;overflow:auto;padding:8px 20px}
.line{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.dot{width:44px;height:44px;border-radius:12px}
.line .nm{font-weight:600;line-height:1.3}
.line .sub{font-size:14px;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{border:0;background:none;width:32px;height:32px;cursor:pointer;font-size:18px}
.qty output{min-width:22px;text-align:center;font-weight:600}
.empty{color:var(--muted);padding:32px 0}
.d-foot{padding:16px 20px 20px;border-top:1px solid var(--line);display:grid;gap:12px}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:700}

.panel{
  position:fixed;inset:0;z-index:22;background:var(--bg);overflow:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:none;
}
.panel.open{display:block}
.p-in{max-width:980px;margin:0 auto;padding:20px 20px 48px}
.p-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.p-top h2{font-size:clamp(30px,5vw,44px)}
.intro{color:var(--muted);margin:0 0 24px}
.order-grid{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:860px){.order-grid{grid-template-columns:1.5fr 1fr;align-items:start}.summary{position:sticky;top:20px}}
fieldset{border:0;margin:0 0 26px;padding:0}
legend{font-family:inherit;font-weight:700;font-size:19px;padding:0;margin-bottom:12px;border-bottom:2px solid var(--ink);width:100%;padding-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label,.q{font-weight:600;font-size:15px}
.opt{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],input[type=tel],input[type=date],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-height:46px
}
textarea{min-height:84px;resize:vertical}
input[type=tel]{direction:ltr;text-align:start}
html[dir="rtl"] input[type=tel]{text-align:right}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{position:relative;cursor:pointer}
.choices input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choices span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-size:15px;font-weight:400}
.choices input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.choices input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.err-msg{color:var(--err);font-size:14px;display:none}
.invalid .err-msg{display:block}
.invalid input,.invalid select,.invalid textarea{border-color:var(--err)}
.invalid .choices span{border-color:var(--err)}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.summary h3{font-size:22px;margin-bottom:8px}
.s-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.summary .tot{margin:14px 0 16px}
.form-err{color:var(--err);font-size:15px;margin:0 0 10px;display:none}
.form-err.show{display:block}
.hidden{display:none!important}

.done{max-width:620px;margin:40px auto;text-align:center}
.done .seal{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 18px;font-size:40px}
.done h2{font-size:clamp(28px,5vw,40px);margin-bottom:10px}
.done .num{font-family:"Bodoni Moda",serif;font-size:26px;direction:ltr;display:inline-block;margin:6px 0 18px;letter-spacing:.04em}
.done p{color:var(--muted)}
.done .acts{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:22px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:30;opacity:0;transition:.2s;pointer-events:none;font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* sheet-driven additions */
.promo{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:15px;font-weight:600;padding:7px 14px}
.prod-art{position:relative}
.badges{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
.badge{background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.badge.sale{background:var(--accent);color:var(--accent-ink)}
.badge.out{background:#6B6B6B;color:#fff}
.prod.is-out .prod-art img,.prod.is-out .prod-art svg{opacity:.4;filter:grayscale(.6)}
.price.on-sale{color:var(--accent)}
.old{text-decoration:line-through;color:var(--muted);font-weight:400;font-size:15px;margin-inline-start:6px}
.add[disabled]{opacity:.5;cursor:not-allowed}
.btn.busy{opacity:.6;pointer-events:none}
.done .saved{display:inline-block;background:var(--soft);border-radius:999px;padding:6px 14px;font-size:15px;margin-bottom:10px}

/* compact top */
.mark img{display:block;height:46px;width:auto;border-radius:8px}
.top-in{padding-top:8px;padding-bottom:8px}
.hero.compact{display:grid;grid-template-columns:1fr;gap:20px;align-items:center;padding:22px 20px 22px;text-align:center}
@media (min-width:700px){.hero.compact{grid-template-columns:1.15fr 1fr}}
.hero.compact .local-name{font-size:clamp(20px,2.6vw,26px);margin:0;color:var(--ink);font-weight:700}
.hero.compact .tag{font-size:16px;color:var(--muted);margin:6px auto 14px;max-width:32em}
.hero.compact .btn{padding:10px 22px;font-size:16px}
.hero.compact .hero-img{border-radius:18px;max-height:200px}
.hero.compact .hero-img img{height:200px;width:100%;object-fit:cover}
.film{padding:15px 16px;font-size:15px}
.film::before{top:4px}.film::after{bottom:4px}
.film::before,.film::after{height:5px}
@media (max-width:699px){.hero.compact .hero-img{display:none}.hero.compact{padding:16px 16px 18px}}
@media (max-width:480px){.mark img{height:36px}}

/* logo in the middle of the hero row */
.hero-logo img{display:block;width:100%;max-width:260px;height:auto;margin:0 auto;border-radius:14px;background:#0E0C0D;box-shadow:0 18px 40px -26px rgba(0,0,0,.55)}
@media (min-width:800px){.hero.compact{grid-template-columns:1fr auto 1fr}.hero-logo{width:260px}}
@media (max-width:799px){.hero-logo{order:-1}.hero-logo img{max-width:220px}}
@media (min-width:700px) and (max-width:799px){.hero.compact{grid-template-columns:1fr 1fr}.hero-logo{grid-column:1 / -1}}

/* delivery & payment info */
.perks{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 26px;padding:11px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:15px;text-align:center}
.perks b{font-weight:600}
.bitbox{background:var(--soft);border-radius:14px;padding:12px 16px;color:var(--ink)!important;font-size:17px}
.bitbox b{font-size:20px;margin-inline-start:6px}

/* show photos whole, with their own background */
.prod-art.photo{background:var(--soft)}
.prod-art.photo img{object-fit:contain}
.prod:hover .prod-art.photo img{transform:none}
.hero.compact .hero-img{max-height:none;background:transparent;box-shadow:none}
.hero.compact .hero-img img{height:auto;max-height:220px;width:auto;max-width:100%;object-fit:contain;margin:0 auto;border-radius:16px}
</style>

        <form id="orderForm" novalidate>
          <fieldset>
            <legend data-t="secContact"></legend>
            <div class="row">
              <div class="field" data-req>
                <label for="fName" data-t="fName"></label>
                <input type="text" id="fName" name="name" autocomplete="name">

              </div>
              <div class="field" data-req data-phone>
                <label for="fPhone" data-t="fPhone"></label>
                <input type="tel" id="fPhone" name="phone" autocomplete="tel" inputmode="tel" placeholder="050-1234567">

              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend data-t="secDelivery"></legend>

              <div class="choices">
                <label><input type="radio" name="method" value="pickup"><span data-t="mPickup"></span></label>
                <label><input type="radio" name="method" value="delivery"><span data-t="mDelivery"></span></label>
              </div>
              <span class="err-msg" data-t="req"></span>
            </div>

              <div class="field" data-req-delivery>

                <input type="text" id="fCity" name="city" autocomplete="address-level2">
                <span class="err-msg" data-t="req"></span>
              </div>
              <div class="field" data-req-delivery>
                <label for="fAddress" data-t="fAddress"></label>
                <input type="text" id="fAddress" name="address" autocomplete="street-address">
                <span class="err-msg" data-t="req"></span>
              </div>
            </div>
            <div class="field" data-req>
              <label for="fDate" data-t="fDate"></label>
              <input type="date" id="fDate" name="date">
              <span class="err-msg" data-t="req"></span>
            </div>
          </fieldset>

          <fieldset>
            <legend data-t="secFit"></legend>
            <div class="field">
              <span class="q"><span data-t="fSkin"></span> <span class="opt" data-t="optional"></span></span>

              <div class="choices" id="shadeChoices"></div>

              <input type="text" id="fAllergy" name="allergy" data-tp="fAllergyPh">

                <label><input type="radio" name="gift" value="yes"><span data-t="yes"></span></label>

            </div>

              <textarea id="fGiftNote" name="giftNote" maxlength="200"></textarea>

          </fieldset>

          <fieldset>
            <legend data-t="secPay"></legend>

              <select id="fSource" name="source"></select>

            <div class="field">
              <label for="fNotes"><span data-t="fNotes"></span> <span class="opt" data-t="optional"></span></label>
              <textarea id="fNotes" name="notes" maxlength="500"></textarea>

              <span class="err-msg" data-t="req"></span>

function art(p){

function applyText(){
  const t=L();
  document.documentElement.lang=lang;
  document.documentElement.dir = lang==="en" ? "ltr" : "rtl";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t[el.dataset.t]; if(typeof v==="string") el.textContent=v;});
  document.querySelectorAll("[data-tl]").forEach(el=>el.setAttribute("aria-label",t[el.dataset.tl]));
  document.querySelectorAll("[data-tp]").forEach(el=>el.placeholder=t[el.dataset.tp]);
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  if (SET.address) $('[data-t="footAddr"]').textContent = SET.address[lang];
  if (SET.hours) $('[data-t="footHours"]').textContent = SET.hours[lang];
  const promo=$("#promo"), bt = SET.banner && SET.banner[lang];
  promo.textContent = bt || ""; promo.classList.toggle("hidden", !bt);
  const keepSkin=(document.querySelector('input[name=skin]:checked')||{}).value;
  const keepShade=(document.querySelector('input[name=shade]:checked')||{}).value;
  $("#skinChoices").innerHTML=Object.entries(t.skins).map(([k,v])=>`<label><input type="radio" name="skin" value="${k}" ${k===keepSkin?"checked":""}><span>${v}</span></label>`).join("");
  $("#shadeChoices").innerHTML=Object.entries(t.shades).map(([k,v])=>`<label><input type="radio" name="shade" value="${k}" ${k===keepShade?"checked":""}><span>${v}</span></label>`).join("");
  const keepSrc=$("#fSource").value;
  $("#fSource").innerHTML=Object.entries(t.sources).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  $("#fSource").value=keepSrc;
  $("#footWa").href = waUrl(t.waContactMsg);
  renderChips(); renderGrid(); renderCart();
}
function renderChips(){
  const t=L();
  const present = new Set(PRODUCTS.map(p=>p.cat));
  const keys = ["all"];
  if (PRODUCTS.some(p=>p.sale && !p.out)) keys.push("sale");
  ["face","eyes","lips","cheeks","other"].forEach(k=>{ if(present.has(k)) keys.push(k); });
  if (!keys.includes(cat)) cat="all";
  $("#chips").innerHTML = keys.map(k=>`<button type="button" data-cat="${k}" aria-pressed="${k===cat}">${t.cats[k]}</button>`).join("");
}
function renderGrid(){
  const t=L();
  const list = PRODUCTS.filter(p=> cat==="all" || (cat==="sale" ? (p.sale && !p.out) : p.cat===cat));
  $("#grid").innerHTML = list.length ? list.map(p=>{
    const inCart = cart[p.id]>0;
    const badges = [];
    if (p.out) badges.push(`<span class="badge out">${t.soldOut}</span>`);
    else if (p.sale) badges.push(`<span class="badge sale">${t.sale} −${Math.round((1-p.sale/p.price)*100)}%</span>`);
    if (p.label && p.label[lang]) badges.push(`<span class="badge">${esc(p.label[lang])}</span>`);
    const nm = esc(p.name[lang]);
    const btn = p.out
      ? `<button type="button" class="add" disabled>${t.soldOut}</button>`
      : `<button type="button" class="add ${inCart?"on":""}" data-add="${esc(p.id)}">${inCart?t.added+" · "+cart[p.id]:t.add}</button>`;
    return `<article class="prod${p.out?" is-out":""}">
      <button type="button" class="prod-open" data-open="${esc(p.id)}" aria-label="${nm}"><div class="prod-art${p.img?" photo":""}">${badges.length?`<div class="badges">${badges.join("")}</div>`:""}${p.img?`<img src="${esc(p.img)}" alt="${esc(p.brand)} ${nm}" loading="lazy" referrerpolicy="no-referrer">`:art(p)}${photosOf(p).length>1?`<span class="pcount">1/${photosOf(p).length}</span>`:""}</div></button>
      <div class="prod-body">
        ${p.brand?`<div class="brand">${esc(p.brand)}</div>`:""}
        <h3><button type="button" data-open="${esc(p.id)}">${nm}</button></h3>
        <p class="desc">${esc(p.desc[lang])}</p>
        <div class="prod-foot">
          <span class="price${p.sale?" on-sale":""}">${money(unit(p))}${p.sale?`<span class="old">${money(p.price)}</span>`:""}</span>
          ${btn}
        </div>
      </div>
    </article>`;}).join("") : `<p class="empty">${LOADING?t.loading:t.noProducts}</p>`;
  $("#swatches").innerHTML = PRODUCTS.slice(0,9).map(p=>`<span style="background:${/^#[0-9a-f]{3,8}$/i.test(p.color)?p.color:"#C9A9B8"}"></span>`).join("");
}
function items(){return Object.keys(cart).filter(id=>byId[id]&&cart[id]>0).map(id=>({p:byId[id],q:cart[id]}))}
function total(){return items().reduce((s,i)=>s+unit(i.p)*i.q,0)}
function thumb(p){return p.img?`<img class="dot" src="${esc(p.img)}" alt="" style="object-fit:cover;background:#fff" referrerpolicy="no-referrer">`:`<span class="dot" style="background:${/^#[0-9a-f]{3,8}$/i.test(p.color)?p.color:"#C9A9B8"}"></span>`}
function renderCart(){
  const t=L(), list=items();
  $("#cartCount").textContent = list.reduce((s,i)=>s+i.q,0);
  $("#cartBody").innerHTML = list.length ? list.map(({p,q})=>`
    <div class="line">
      ${thumb(p)}
      <div><div class="nm">${esc(p.brand)}${p.brand?" · ":""}${esc(p.name[lang])}</div><div class="sub">${money(unit(p))}</div></div>
      <div class="qty" role="group" aria-label="${t.qty}">
        <button type="button" data-dec="${esc(p.id)}" aria-label="−">−</button>
        <output>${q}</output>
        <button type="button" data-inc="${esc(p.id)}" aria-label="+">+</button>
      </div>
    </div>`).join("") : `<p class="empty">${t.cartEmpty}</p>`;
  $("#cartTotal").textContent = money(total());
  $("#toOrder").disabled = !list.length;
  $("#sumLines").innerHTML = list.map(({p,q})=>`<div class="s-line"><span>${esc(p.brand)} ${esc(p.name[lang])} × ${q}</span><span>${money(unit(p)*q)}</span></div>`).join("") || `<p class="empty">${t.cartEmpty}</p>`;
  $("#sumTotal").textContent = money(total());
}
function save(){store.set("ap_cart",cart)}
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)}

/* ===== Events ===== */
document.querySelector(".langs").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;lang=b.dataset.lang;store.set("ap_lang",lang);applyText();});
$("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;cat=b.dataset.cat;renderChips();renderGrid();});
$("#grid").addEventListener("click",e=>{const b=e.target.closest("[data-add]");if(!b)return;const id=b.dataset.add;if(!byId[id]||byId[id].out)return;cart[id]=Math.min(99,(cart[id]||0)+1);save();renderGrid();renderCart();toast(L().addedToast);});
$("#cartBody").addEventListener("click",e=>{
  const i=e.target.closest("[data-inc]"), d=e.target.closest("[data-dec]");
  if(i){cart[i.dataset.inc]=Math.min(99,cart[i.dataset.inc]+1);}
  else if(d){cart[d.dataset.dec]--; if(cart[d.dataset.dec]<=0) delete cart[d.dataset.dec];}
  else return;
  save(); renderCart(); renderGrid();
});
function openCart(){$("#drawer").classList.add("open");$("#scrim").classList.add("open");$("#drawer").setAttribute("aria-hidden","false");$("#closeCart").focus()}
function closeCart(){$("#drawer").classList.remove("open");$("#scrim").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true")}
$("#openCart").onclick=openCart; $("#closeCart").onclick=closeCart; $("#scrim").onclick=closeCart;
$("#toOrder").onclick=()=>{closeCart();openPanel()};
function openPanel(){$("#formView").classList.remove("hidden");$("#doneView").classList.add("hidden");$("#panel").classList.add("open");document.body.style.overflow="hidden";$("#panel").scrollTop=0;$("#fName").focus();}
function closePanel(){$("#panel").classList.remove("open");document.body.style.overflow=""}
$("#closePanel").onclick=closePanel;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeCart();closePanel()}});
(function(){const d=new Date();$("#fDate").min=new Date(d.getTime()-d.getTimezoneOffset()*60000+86400000).toISOString().slice(0,10);})();

const form=$("#orderForm");
form.addEventListener("change",e=>{
  if(e.target.name==="method") $("#addrRow").classList.toggle("hidden",e.target.value!=="delivery");
  if(e.target.name==="gift") $("#giftNoteField").classList.toggle("hidden",e.target.value!=="yes");
  const f=e.target.closest(".field"); if(f) f.classList.remove("invalid");
});
form.addEventListener("input",e=>{const f=e.target.closest(".field"); if(f) f.classList.remove("invalid");});
function validPhone(v){const d=v.replace(/\D/g,"");return /^0\d{8,9}$/.test(d)||/^972\d{8,9}$/.test(d)}
function validate(){
  let ok=true; const delivery=form.elements.method.value==="delivery";
  form.querySelectorAll(".field").forEach(f=>{
    let bad=false;
    if(f.hasAttribute("data-req")||(delivery&&f.hasAttribute("data-req-delivery"))){
      if(f.dataset.radio) bad=!form.elements[f.dataset.radio].value;
      else if(f.hasAttribute("data-check")) bad=!f.querySelector("input").checked;
      else { const inp=f.querySelector("input,select,textarea"); bad=!inp.value.trim(); if(!bad&&f.hasAttribute("data-phone")) bad=!validPhone(inp.value); }
    }
    f.classList.toggle("invalid",bad); if(bad) ok=false;
  });
  return ok;
}
function waUrl(text){return SET.whatsapp?`https://wa.me/${SET.whatsapp}?text=${encodeURIComponent(text)}`:"#"}

function collect(){
  const v=n=>(form.elements[n]&&form.elements[n].value||"").trim(), t=L();
  return {
    lang, items: items().map(i=>({id:i.p.id,q:i.q})),
    name:v("name"), phone:v("phone"), method:v("method"), city:v("city"), address:v("address"), date:v("date"),
    skin: v("skin")?t.skins[v("skin")]:"", shade: v("shade")?t.shades[v("shade")]:"", allergy:v("allergy"),
    gift:v("gift"), giftNote:v("giftNote"),
    pay: ({cash:T.he.payCash,bit:T.he.payBit,card:T.he.payCard})[v("pay")]||"",
    source: v("source")?T.he.sources[v("source")]:"", notes:v("notes")
  };
}
function buildWa(num, o, res){
  const t=L();
  const lines=[`*${t.waNew} · Atelier Paris*`,`${t.doneNum}: ${num}`,"",`*${t.waItems}:*`,
    ...res.items.map(i=>`• ${i.name} × ${i.q} = ${money(i.sum)}`),`*${t.total}: ${money(res.total)}*`,"",
    `${t.fName}: ${o.name}`,`${t.fPhone}: ${o.phone}`,`${t.fMethod} ${o.method==="delivery"?t.mDelivery:t.mPickup}`];
  if(o.method==="delivery") lines.push(`${t.fCity}: ${o.city}`,`${t.fAddress}: ${o.address}`);
  lines.push(`${t.fDate}: ${o.date}`);
  lines.push(`${t.fPay}: ${({cash:t.payCash,bit:t.payBit})[form.elements.pay.value]||""}`);
  if(o.notes) lines.push(`${t.fNotes}: ${o.notes}`);
  return waUrl(lines.join("\n"));
}
function showDone(num, o, res){
  $("#orderNum").textContent=num;
  (function(){const isBit=form.elements.pay&&form.elements.pay.value==="bit";$("#bitBox").classList.toggle("hidden",!isBit);$("#bitNum").textContent=BIT_NUM||"";$("#bitNum").classList.toggle("hidden",!BIT_NUM);$("#bitLater").classList.toggle("hidden",!!BIT_NUM);$('#bitBox [data-t="doneBit"]').classList.toggle("hidden",!BIT_NUM);})();
  $("#waLink").href=buildWa(num,o,res);
  $("#waLink").classList.toggle("hidden",!SET.whatsapp);
  $("#formView").classList.add("hidden");$("#doneView").classList.remove("hidden");$("#panel").scrollTop=0;
  cart={}; save(); renderCart(); renderGrid();
}
form.addEventListener("submit",e=>{
  e.preventDefault();
  const t=L(), err=$("#formErr"), btn=$("#submitBtn");
  if(!items().length){err.textContent=t.errEmpty;err.classList.add("show");return}
  if(!validate()){err.textContent=t.errForm;err.classList.add("show");const f=form.querySelector(".invalid input,.invalid select,.invalid textarea");if(f)f.focus();return}
  err.classList.remove("show");
  const o=collect();
  btn.classList.add("busy"); btn.textContent=t.sending;
  const done=()=>{btn.classList.remove("busy");btn.textContent=L().submit;};
  fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"order",order:o})})
    .then(r=>r.json())
    .then(res=>{
      done();
      if(res&&res.ok){ showDone(res.num,o,res); return; }
      if(res&&res.code==="STOCK"){ res.ids.forEach(id=>{delete cart[id]; if(byId[id]) byId[id].out=true;}); save(); renderCart(); renderGrid(); err.textContent=t.errStock; }
      else if(res&&res.code==="FORM"){ err.textContent=t.errForm; validate(); }
      else err.textContent=t.errSend;
      err.classList.add("show");
    })
    .catch(()=>{done(); err.textContent=t.errSend; err.classList.add("show");});
});
$("#newOrder").onclick=()=>{form.reset();$("#addrRow").classList.add("hidden");$("#giftNoteField").classList.add("hidden");closePanel();window.scrollTo(0,0)};

/* ===== Viewer ===== */
const pv={list:[],i:0,prod:null};
function pvRender(){
  const t=L(), n=pv.list.length;
  $("#pvImg").src=pv.list[pv.i];
  $("#pvImg").alt=pv.prod?pv.prod.name[lang]:"";
  $("#pvPrev").style.display=$("#pvNext").style.display = n>1?"":"none";
  $("#pvDots").innerHTML = n>1 ? pv.list.map((_,k)=>`<button type="button" data-k="${k}" aria-label="${k+1}" aria-current="${k===pv.i}"></button>`).join("") : "";
  document.querySelectorAll("#pvInfo .pv-thumbs button").forEach((b,k)=>b.setAttribute("aria-current",k===pv.i));
}
function pvInfo(){
  const t=L(), p=pv.prod; $("#pvBox").classList.add("has-info");
  const inCart=cart[p.id]>0;
  $("#pvInfo").innerHTML=`${p.brand?`<div class="brand">${esc(p.brand)}</div>`:""}<h3>${esc(p.name[lang])}</h3><p class="desc">${esc(p.desc[lang])}</p>
    <div class="price${p.sale?" on-sale":""}">${money(unit(p))}${p.sale?`<span class="old">${money(p.price)}</span>`:""}</div>
    ${pv.list.length>1?`<div class="pv-thumbs">${pv.list.map((src,k)=>`<button type="button" data-k="${k}" aria-label="${k+1}" aria-current="${k===pv.i}"><img src="${esc(src)}" alt="" referrerpolicy="no-referrer"></button>`).join("")}</div>`:""}
    ${p.out?`<button type="button" class="btn" disabled>${t.soldOut}</button>`:`<button type="button" class="btn" data-pvadd="${esc(p.id)}">${inCart?t.added+" · "+cart[p.id]+" · +1":t.add}</button>`}`;
}
function openViewer(p){pv.prod=p;pv.list=photosOf(p);pv.i=0;if(!pv.list.length)return;pvInfo();pvRender();$("#pv").classList.add("open");document.body.style.overflow="hidden";$("#pvClose").focus()}
function closeViewer(){$("#pv").classList.remove("open");if(!$("#panel").classList.contains("open"))document.body.style.overflow=""}
function pvGo(d){const n=pv.list.length;if(n<2)return;pv.i=(pv.i+d+n)%n;pvRender()}
const rtl=()=>document.documentElement.dir==="rtl";
$("#pvPrev").onclick=()=>pvGo(rtl()?1:-1);
$("#pvNext").onclick=()=>pvGo(rtl()?-1:1);
$("#pvClose").onclick=closeViewer;
$("#pv").addEventListener("click",e=>{
  if(e.target.id==="pv") return closeViewer();
  const k=e.target.closest("[data-k]"); if(k){pv.i=+k.dataset.k;pvRender();return}
  const a=e.target.closest("[data-pvadd]"); if(a){const id=a.dataset.pvadd;cart[id]=Math.min(99,(cart[id]||0)+1);save();renderGrid();renderCart();pvInfo();pvRender();toast(L().addedToast);}
});
(function(){let x0=null;const st=$("#pvStage");
  st.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  st.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40){const fwd=dx<0;pvGo((rtl()?!fwd:fwd)?1:-1)}},{passive:true});
})();
document.addEventListener("keydown",e=>{if(!$("#pv").classList.contains("open"))return;if(e.key==="Escape")closeViewer();if(e.key==="ArrowRight")pvGo(rtl()?-1:1);if(e.key==="ArrowLeft")pvGo(rtl()?1:-1);});
$("#grid").addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(!o)return;const p=byId[o.dataset.open];if(p)openViewer(p);});

document.getElementById("heroImg").src=HERO_IMG;
document.getElementById("heroLogo").src=document.querySelector(".mark img").src;
applyText();
function loadData(){
  fetch(API_URL+"?api=data",{cache:"no-store"})
    .then(r=>r.json())
    .then(d=>{
      if(!d||!Array.isArray(d.products)) throw new Error("bad");
      DATA=d; PRODUCTS=d.products; SET=d.settings||{}; BIT_NUM=SET.bit||"";
      byId=Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
      for(const id in cart){ if(!byId[id]||byId[id].out) delete cart[id]; }
      save(); LOADING=false; applyText();
      try{ localStorage.setItem("ap_data",JSON.stringify(d)); }catch(e){}
    })
    .catch(()=>{ LOADING=false; renderGrid(); setTimeout(loadData,4000); });
}
loadData();
</script>
</body>
